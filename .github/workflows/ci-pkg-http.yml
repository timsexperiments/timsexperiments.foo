name: CI - Package HTTP

on:
  push:
    paths:
      - "package.json"
      - "bun.lock"
      - ".bun-version"
      - "turbo.json"
      - "packages/http/**"
      - ".github/workflows/ci-pkg-http.yml"
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - ".bun-version"
      - "turbo.json"
      - "packages/http/**"
      - ".github/workflows/ci-pkg-http.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test --filter=@timsexperiments/http
